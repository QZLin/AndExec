name: Build & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      # 把四个 exe 连同说明、许可收集到一个目录,方便打包
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/andexec.exe build/andexec_d.exe build/andexec_w.exe build/andexec_wd.exe dist/
          cp README.md LICENSE dist/ 2>/dev/null || true

      - name: Zip artifacts
        shell: bash
        run: |
          zip -r andexec.zip dist

      # 每次 push/PR 都存档,方便随时下载验证
      - uses: actions/upload-artifact@v4
        with:
          name: andexec-${{ github.sha }}
          path: andexec.zip

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: andexec.zip
          generate_release_notes: true
